<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Express your mood with iconic Bravo and Real Housewives GIFs">
    <title>Bravo Mood GIF - Real Housewives Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍸 Bravo Mood GIF 🍸</h1>
            <p class="tagline">Express yourself like a Real Housewife</p>
        </header>

        <main>
            <!-- Franchise Filters -->
            <div class="franchise-filters">
                <div class="filter-label">Filter by franchise:</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-franchise="all">All</button>
                    <button class="filter-btn" data-franchise="rhony">NYC</button>
                    <button class="filter-btn" data-franchise="rhobh">BH</button>
                    <button class="filter-btn" data-franchise="rhoa">ATL</button>
                    <button class="filter-btn" data-franchise="rhonj">NJ</button>
                    <button class="filter-btn" data-franchise="rhop">Potomac</button>
                    <button class="filter-btn" data-franchise="rhoslc">SLC</button>
                </div>
            </div>

            <!-- Housewife Channeling -->
            <div class="housewife-randomizer">
                <button id="channel-housewife-btn" class="channel-btn">
                    ✨ Channel a Random Housewife ✨
                </button>
                <div id="current-housewife" class="current-housewife hidden"></div>
            </div>
            <div class="input-section">
                <label for="mood-text">How are you feeling today?</label>
                <textarea
                    id="mood-text"
                    placeholder="Tell us about your day... 'My coworker ate my lunch' or 'Just closed a huge deal!'"
                    rows="3"
                    maxlength="200"
                ></textarea>
                <div class="char-count"><span id="char-counter">0</span>/200</div>
            </div>

            <button id="generate-btn" class="generate-btn">
                ✨ Get My GIF ✨
            </button>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Finding the perfect Bravo moment...</p>
            </div>

            <div id="result-section" class="result-section hidden">
                <div class="gif-container">
                    <img id="gif-image" src="" alt="Your Bravo mood GIF">
                    <button id="favorite-btn" class="favorite-btn" aria-label="Add to favorites">
                        <span class="heart">♡</span>
                    </button>
                </div>
                <div class="result-actions">
                    <button id="share-btn" class="share-btn">
                        📤 Share
                    </button>
                    <button id="download-btn" class="download-btn">
                        💾 Download
                    </button>
                    <button id="new-gif-btn" class="secondary-btn">
                        🔄 Try Another
                    </button>
                </div>
            </div>

            <!-- Favorites Gallery -->
            <div id="favorites-section" class="favorites-section hidden">
                <div class="favorites-header">
                    <h2>💎 My Favorite GIFs</h2>
                    <button id="toggle-favorites-btn" class="toggle-favorites-btn">
                        Show Favorites (<span id="favorites-count">0</span>)
                    </button>
                </div>
                <div id="favorites-gallery" class="favorites-gallery hidden">
                    <p class="empty-favorites">No favorites yet! Heart a GIF to save it here.</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Giphy • Made with 💎 for Bravo fans</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
