<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Express your mood with iconic Bravo and Real Housewives GIFs">
    <title>Bravo Mood GIF - Real Housewives Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍸 Bravo Mood GIF 🍸</h1>
            <p class="tagline">Express yourself like a Real Housewife</p>
        </header>

        <main>
            <div class="input-section">
                <label for="mood-text">How are you feeling today?</label>
                <textarea
                    id="mood-text"
                    placeholder="Tell us about your day... 'My coworker ate my lunch' or 'Just closed a huge deal!'"
                    rows="3"
                    maxlength="200"
                ></textarea>
                <div class="char-count"><span id="char-counter">0</span>/200</div>
            </div>

            <div class="mood-selector-section">
                <label for="mood-dropdown">Or pick an iconic Bravo mood:</label>
                <select id="mood-dropdown">
                    <option value="">Select your vibe...</option>
                    <optgroup label="Feeling Fabulous">
                        <option value="real housewives fabulous">Gone with the wind fabulous</option>
                        <option value="real housewives living my best life">Living my best life</option>
                        <option value="real housewives turtle time">Turtle time!</option>
                        <option value="real housewives champagne">Pop the champagne!</option>
                        <option value="real housewives money can't buy class">Money can't buy you class</option>
                        <option value="real housewives life is a cabaret">Life is a cabaret!</option>
                        <option value="real housewives feeling jovani">Feeling Jovani!</option>
                        <option value="real housewives glam squad">Glam squad ready!</option>
                    </optgroup>
                    <optgroup label="Feeling Sassy">
                        <option value="real housewives not well bitch">Not well, bitch!</option>
                        <option value="real housewives bye wig">Bye, wig!</option>
                        <option value="real housewives clip">Clip!</option>
                        <option value="real housewives you're doing amazing">You're doing amazing, sweetie!</option>
                        <option value="real housewives who gonna check me boo">Who gon' check me, boo?</option>
                        <option value="real housewives mention it all">Mention it all!</option>
                        <option value="real housewives be cool dont be uncool">Be cool, don't be all uncool</option>
                        <option value="real housewives prostitution whore">You were engaged 19 times?!</option>
                    </optgroup>
                    <optgroup label="Feeling Dramatic">
                        <option value="real housewives table flip">Table flip moment</option>
                        <option value="real housewives how dare you">How dare you!</option>
                        <option value="real housewives who is she">Who is she?</option>
                        <option value="real housewives stunned">I'm stunned</option>
                        <option value="real housewives spell naive">Spell naive, I'll wait</option>
                        <option value="real housewives were people going to jail">Were people going to jail?</option>
                        <option value="real housewives dinner party from hell">Dinner party from hell vibes</option>
                        <option value="real housewives you stole my house">You stole my goddamn house!</option>
                        <option value="real housewives know that">Know that!</option>
                    </optgroup>
                    <optgroup label="Feeling Over It">
                        <option value="real housewives not my circus">Not my circus</option>
                        <option value="real housewives close your legs">Close your legs to married men</option>
                        <option value="real housewives done">I'm done!</option>
                        <option value="real housewives goodbye kyle">Goodbye Kyle!</option>
                        <option value="real housewives i said what i said">I said what I said</option>
                        <option value="real housewives thats my opinion">That's my opinion!</option>
                        <option value="real housewives beast">Beast? How dare you!</option>
                        <option value="real housewives dont come for me">Don't come for me unless I call for you</option>
                    </optgroup>
                    <optgroup label="Feeling Supportive">
                        <option value="real housewives you got this">You got this!</option>
                        <option value="real housewives proud of you">So proud of you!</option>
                        <option value="real housewives cheers">Cheers to that!</option>
                        <option value="real housewives love that">Love that journey for you</option>
                        <option value="real housewives go to sleep">Go to sleep!</option>
                        <option value="real housewives we see each other">We see each other!</option>
                    </optgroup>
                    <optgroup label="Feeling Shady">
                        <option value="real housewives pay attention">Pay attention, puh-lease!</option>
                        <option value="real housewives is your wig squeezing">Is your wig squeezing your brain?</option>
                        <option value="real housewives kim richards">Let's talk about the husband</option>
                        <option value="real housewives countess">Even Louis Vuitton makes mistakes</option>
                        <option value="real housewives life is not a cabaret">Life is not a cabaret</option>
                        <option value="real housewives go to sleep">I made it nice!</option>
                        <option value="real housewives tax evasion">You're supposed to write a check</option>
                        <option value="real housewives ordacity">The ordacity!</option>
                    </optgroup>
                    <optgroup label="Feeling Confused">
                        <option value="real housewives what is this hunny">What is this, hunny?</option>
                        <option value="real housewives whats happening">What's happening here?</option>
                        <option value="real housewives confused af">I'm very confused</option>
                        <option value="real housewives is this the twilight zone">Is this the twilight zone?</option>
                        <option value="real housewives what did i walk into">What did I walk into?</option>
                    </optgroup>
                    <optgroup label="Deep Cuts (True Fans Only)">
                        <option value="real housewives kadooze">Kadooze to you!</option>
                        <option value="real housewives googly eyes">You're such a f**king liar, Camille!</option>
                        <option value="real housewives slut pig">Slut pig!</option>
                        <option value="real housewives herman munster shoes">Herman Munster shoes</option>
                        <option value="real housewives fix your face">Fix your face, Gretchen</option>
                        <option value="real housewives word on the street">Word on the street...</option>
                        <option value="real housewives is bitch better">Is bitch better?</option>
                        <option value="real housewives you beast">You beast!</option>
                        <option value="real housewives sell the house">Sell the house, Joe!</option>
                        <option value="real housewives cop without a badge">Cop without a badge</option>
                        <option value="real housewives tardy for the party">Tardy for the party</option>
                        <option value="real housewives ring didnt mean a thing">The ring didn't mean a thing</option>
                        <option value="real housewives im channeling chanel">I'm channeling Chanel</option>
                        <option value="real housewives not a white refrigerator">Not a white refrigerator!</option>
                    </optgroup>
                </select>
            </div>

            <button id="generate-btn" class="generate-btn">
                ✨ Get My GIF ✨
            </button>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Finding the perfect Bravo moment...</p>
            </div>

            <div id="result-section" class="result-section hidden">
                <div class="gif-container">
                    <img id="gif-image" src="" alt="Your Bravo mood GIF">
                </div>
                <div class="result-actions">
                    <button id="share-btn" class="share-btn">
                        📤 Share
                    </button>
                    <button id="download-btn" class="download-btn">
                        💾 Download
                    </button>
                    <button id="new-gif-btn" class="secondary-btn">
                        🔄 Try Another
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Giphy • Made with 💎 for Bravo fans</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
