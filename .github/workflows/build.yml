name: Build
on:
  push:
    branches: [finders-keepers]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: xcodebuild -version && swift --version
      - name: Compile the app
        run: |
          set -o pipefail
          xcodebuild -project FindersKeepers.xcodeproj -scheme FindersKeepers \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "(error|warning): |BUILD (SUCCEEDED|FAILED)" | sort -u | head -200
      - name: Show the Info.plist that was generated
        if: success()
        run: plutil -p build/Build/Products/Debug-iphoneos/FindersKeepers.app/Info.plist
      - name: Full log on failure
        if: failure()
        run: tail -150 build.log
