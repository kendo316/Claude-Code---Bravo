name: Build
on:
  push:
    branches: [finders-keepers]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test the core logic
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail
          swift test 2>&1 | tail -80
  build:
    name: Compile the app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: xcodebuild -version && swift --version
      - name: Compile
        run: |
          set -o pipefail
          xcodebuild -project FindersKeepers.xcodeproj -scheme FindersKeepers \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "(error|warning): |BUILD (SUCCEEDED|FAILED)" | sort -u | head -200
      - name: Show the Info.plist that was generated
        if: success()
        run: plutil -p build/Build/Products/Debug-iphoneos/FindersKeepers.app/Info.plist
      - name: Full log on failure
        if: failure()
        run: tail -150 build.log
  screens:
    name: Run in a simulator
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/simulator_shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
          retention-days: 7
