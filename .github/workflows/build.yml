name: Build
on:
  push:
    branches: [finders-keepers]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test the core logic
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail
          swift test 2>&1 | tail -80
  build:
    name: Compile the app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: xcodebuild -version && swift --version
      - name: Compile
        run: |
          set -o pipefail
          xcodebuild -project FindersKeepers.xcodeproj -scheme FindersKeepers \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "(error|warning): |BUILD (SUCCEEDED|FAILED)" | sort -u | head -200
      - name: Show the Info.plist that was generated
        if: success()
        run: plutil -p build/Build/Products/Debug-iphoneos/FindersKeepers.app/Info.plist
      - name: Full log on failure
        if: failure()
        run: tail -150 build.log
  screens:
    name: Run in a simulator
    runs-on: xcode-27
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/simulator_shots.sh
      - name: Publish the screenshots to a side branch
        if: always()
        run: |
          cd shots
          for f in *.png; do sips -Z 1500 -s format jpeg -s formatOptions 82 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f *.png
          git init -q -b finders-keepers-shots .
          git add -A
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" finders-keepers-shots
